conditions: 'Three or more fixed-effect dimensions, and a fixed-effect structure fixest calls
  "not regular" -- the dimensions are not fully connected, so the reference levels the solver
  must choose are not uniquely determined. The regression coefficients are unaffected: the
  defect is in `fixef()`, which runs after the fixed effects have been swept out, so it reaches
  only analyses that extract, report, or plot the fixed effects themselves.'
