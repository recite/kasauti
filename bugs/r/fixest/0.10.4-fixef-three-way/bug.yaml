magnitude: 'Verified against fixest 0.10.3, the immediately preceding release. Adjacent versions
  on purpose: 0.10.3 against current 0.14.2 also diverges, but through a second change --
  fixest began dropping singleton fixed-effect groups, so it estimates on 70 rows where 0.10.3
  uses 71 -- and a comparison spanning four minor versions measures every change at once rather
  than this one. On a deterministic 48-row panel with four fixed-effect dimensions, the extracted
  effects fail their own defining identity: added back to Xb they miss the fitted values by
  3.366909547 in 0.10.3 against 4.579378239e-06 in 0.10.4. That makes the case self-adjudicating
  -- no third implementation is needed, because the buggy version contradicts the definition
  of the quantity it reports. Individual values move correspondingly: the first id effect
  is 1.278791359 against -1.458587022, a sign change, and three of the four dimensions were
  pinned to exactly 0 as though that level were the reference, which is precisely what makes
  the output look correctly normalised. The coefficient on x is identical at 1.006553381002.'
