introduced_in: null
introduced_on: null
functions:
- felm
conditions: 'Two or more clustering dimensions in the fourth part of the felm formula, and
  a Cameron-Gelbach-Miller covariance whose smallest eigenvalue comes out negative. The second
  condition is not rare in the regime applied panel work lives in -- few clusters in both
  dimensions -- because CGM is a difference of covariance matrices and nothing constrains
  the result to be positive semi-definite. One clustering dimension is unaffected: with a
  single dimension there is no subtraction and no eigenvalue to go negative.'
condition_probe: felm\s*\((?:(?!felm)[^|;]){0,300}\|(?:(?!felm)[^|;]){0,150}\|(?:(?!felm)[^|;]){0,150}\|(?:(?!felm)[^|;)~]){0,150}\+
category: BEHAVIOR_CHANGE
silent: true
severity: HIGH
