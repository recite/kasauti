[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "concord"
version = "0.1.0"
description = "Differential testing for statistical software: do independent implementations agree, and did they used to be wrong?"
readme = "README.md"
license = "MIT"
authors = [{ name = "Gaurav Sood", email = "gsood07@gmail.com" }]
keywords = ["statistics", "differential-testing", "reproducibility", "replication"]
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "requests>=2.31",
    "anthropic>=0.69",
    "pydantic>=2.0",
]

[project.scripts]
concord = "concord.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/concord"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "RUF012", "D"]
# The page is one HTML/CSS/JS template string. Wrapping its lines to 88 would
# mangle markup for no reader's benefit.
"src/concord/dashboard.py" = ["E501"]
# Case backend scripts are standalone programs run by subprocess: printing is the
# interface, and they are not importable modules.
"cases/**" = ["T20", "S", "D", "N", "INP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -m 'not live'"
pythonpath = ["src"]
markers = [
    "live: hits real CRAN/PyPI endpoints; excluded by default, run with -m live",
    "slow: runs R and Python subprocesses; run with -m slow",
]

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"

[dependency-groups]
dev = [
    "ruff>=0.14",
    "pyright>=1.1.390",
    { include-group = "test" },
]
test = [
    "pytest>=8",
    "pytest-cov>=6",
    "numpy>=2.0",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
]
