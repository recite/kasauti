[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kasauti"
version = "0.1.0"
description = "Changelog archaeology for statistical software: which package bugs were live when a paper was written, and did its scripts touch them?"
readme = "README.md"
license = "MIT"
authors = [{ name = "Gaurav Sood", email = "gsood07@gmail.com" }]
keywords = ["statistics", "reproducibility", "replication", "software-archaeology", "changelogs"]
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    # The harness. Verified bug records are version-regression cases -- does this
    # package agree with its own past self -- which is the same machinery milaan
    # uses to ask whether R agrees with Python, so the two share one runner.
    "milaan",
    "requests>=2.31",
    "anthropic>=0.69",
    "pydantic>=2.0",
]

[project.scripts]
kasauti = "kasauti.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kasauti"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "RUF012", "D"]
# The page is one HTML/CSS/JS template string. Wrapping its lines to 88 would
# mangle markup for no reader's benefit.
"src/kasauti/dashboard.py" = ["E501"]
# Bug backend scripts are standalone programs run by subprocess: printing is the
# interface, and they are not importable modules.
"bugs/**" = ["T20", "S", "D", "N", "INP", "E402"]

[tool.uv.sources]
milaan = { path = "../milaan", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -m 'not live'"
pythonpath = ["src"]
markers = [
    "live: hits real CRAN/PyPI endpoints; excluded by default, run with -m live",
    "slow: runs R and Python subprocesses; run with -m slow",
]

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"

[dependency-groups]
dev = [
    "ruff>=0.14",
    "pyright>=1.1.390",
    { include-group = "test" },
]
test = [
    "pytest>=8",
    "pytest-cov>=6",
    # Needed by the bug records' backend scripts, not by the archaeology itself.
    "numpy>=2.0",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
]
